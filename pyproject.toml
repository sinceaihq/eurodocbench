[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eurodocbench"
version = "0.1.0"
description = "Synthetic multilingual benchmark for European invoice information extraction."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/eurodocbench/fonts/LICENSE-LiberationFonts-OFL.txt"]
authors = [{ name = "Since AI ry", email = "info@sinceai.fi" }]
requires-python = ">=3.10"
keywords = ["benchmark", "document-ai", "invoices", "information-extraction", "ocr", "multilingual", "eu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# Scoring needs only the standard library; generation needs the renderers.
dependencies = []

[project.optional-dependencies]
# Exact pins: the published PDFs are regenerated byte for byte in CI.
generate = ["reportlab==5.0.1", "pypdfium2==5.14.0", "pillow>=10", "numpy>=1.24"]
dev = [
  "eurodocbench[generate]",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "python-stdnum>=1.20",
  "build>=1.2",
  "pip-audit>=2.7",
]

[project.scripts]
eurodocbench-score = "eurodocbench.score:main"
eurodocbench-generate = "eurodocbench.generate:main"

[project.urls]
Homepage = "https://github.com/sinceaihq/eurodocbench"
Repository = "https://github.com/sinceaihq/eurodocbench"
Issues = "https://github.com/sinceaihq/eurodocbench/issues"
Dataset = "https://huggingface.co/datasets/sinceaihq/eurodocbench"

[tool.hatch.build.targets.wheel]
packages = ["src/eurodocbench"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "C4", "PT", "PLW1514"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802"]
"src/eurodocbench/locales.py" = ["E501"]
"src/eurodocbench/baselines/rules.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/eurodocbench"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "pypdfium2.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
